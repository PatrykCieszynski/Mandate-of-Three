[world-server]
port=8087
bind_address="127.0.0.1"
certificate_path="res://data/config/tls/certificate.crt"
key_path="res://data/config/tls/key.key"
database_path="."
motd="WELCOME_TINY_MMO"
name="Classic"
; Enforced World process session budget, including unused accepted tickets.
; This is a safety budget, not measured player capacity.
max_players=64
hardcore=false
bonus_xp=0.0
max_character=5
pvp=true
public_url="127.0.0.1"

[world-manager-client]
address="127.0.0.1"
port=8062
certificate_path="res://data/config/tls/certificate.crt"

[economy]
backend="postgresql"
realm_state=true
connection_env="MANDATE_ECONOMY_CONNECTION"
authority_env="MANDATE_ECONOMY_AUTHORITY_ID"
queue_capacity=2

[runtime]
version=1
; Accounts reserved by accepted tickets must fit both owners.
inventory_bindings=64
; Includes detached dirty/unknown wallets. They are never evicted for a login.
wallet_accounts=64
handoff_tickets=1024
handoff_ttl_ms=30000
; Master acknowledgement deadline must be shorter than ticket lifetime.
handoff_ack_timeout_ms=2000

; Mob interest uses XZ distance in metres, with hysteresis at the boundary.
mob_aoi_enter_radius=60
mob_aoi_exit_radius=72
mob_aoi_cell_size=32
; Start at 100 ms (10 Hz). Compare 150 / 200 ms on the same scene manually.
; Combat publishes every 100 ms, so actual delivery is quantized to that cadence.
; Unchanged transforms are omitted.
; Membership and HP/state continue on the existing reliable combat channel.
mob_position_interval_ms=100
