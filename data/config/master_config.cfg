[gateway-manager-server]
port=8064
bind_address="127.0.0.1"
certificate_path="res://data/config/tls/certificate.crt"
key_path="res://data/config/tls/key.key"

[economy]
backend="postgresql"
realm_state=true
connection_env="MANDATE_ECONOMY_CONNECTION"
authority_env="MANDATE_ECONOMY_AUTHORITY_ID"
queue_capacity=2

[world-manager-server]
port=8062
bind_address="127.0.0.1"
certificate_path="res://data/config/tls/certificate.crt"
key_path="res://data/config/tls/key.key"
