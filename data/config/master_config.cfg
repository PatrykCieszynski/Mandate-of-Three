[gateway-manager-server]
port=8064
bind_address="127.0.0.1"
certificate_path="res://data/config/tls/certificate.crt"
key_path="res://data/config/tls/key.key"

[economy]
backend="postgresql"
realm_state=true
connection_env="MANDATE_ECONOMY_CONNECTION"
authority_env="MANDATE_ECONOMY_AUTHORITY_ID"
queue_capacity=2

[runtime]
version=1
; Includes live grants and unresolved revocations across this Master's Worlds.
master_grants=64
; Maximum in-flight World handoff acknowledgements, not online players.
handoff_tickets=1024
handoff_ttl_ms=30000
handoff_ack_timeout_ms=2000

[world-manager-server]
port=8062
bind_address="127.0.0.1"
certificate_path="res://data/config/tls/certificate.crt"
key_path="res://data/config/tls/key.key"
