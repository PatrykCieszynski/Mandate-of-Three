name: Mandate verification
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      extended:
        description: 'Run optional gameplay/asset regressions'
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v7
        if: github.event_name == 'workflow_dispatch' && inputs.extended
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install Web UI development dependencies
        working-directory: source/client/ui_web
        shell: pwsh
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { throw 'Web UI dependency installation failed' }
      - name: Check Core UI formatting
        working-directory: source/client/ui_web
        shell: pwsh
        run: |
          npm run format:check
          if ($LASTEXITCODE -ne 0) { throw 'Core UI formatting failed' }
      - name: Verify committed static Web UI assets
        shell: pwsh
        run: |
          & ./tools/build-web-ui.ps1 -Tests
          node ./source/client/ui_web/node_modules/typescript/bin/tsc -p ./source/client/ui_web/tsconfig.dev.json --noEmit
          if ($LASTEXITCODE -ne 0) { throw 'Browser preview TypeScript check failed' }
          $generatedChanges = git status --porcelain -- source/client/ui_web/web
          if ($LASTEXITCODE -ne 0 -or $generatedChanges) { throw "Generated Web UI assets are out of date: $generatedChanges" }
      - name: Install the project's Godot editor
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Invoke-WebRequest 'https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_win64.exe.zip' -OutFile "$env:RUNNER_TEMP/godot.zip"
          Expand-Archive "$env:RUNNER_TEMP/godot.zip" -DestinationPath .godot
      - name: Import clean checkout
        shell: pwsh
        run: |
          if (Test-Path dev_assets) { throw 'CI must not contain local legacy assets' }
          if (Test-Path .local) { throw 'CI must not contain local legacy sources' }
          $engine = '.godot/Godot_v4.7.2-stable_win64_console.exe'
          # Existing upstream translations/theme need a cold import before the
          # subsequent project load. Keep both logs for diagnosis.
          & $engine --headless --path . --import *> .godot/cold-import.log
          & $engine --headless --path . --import *> .godot/import.log
          if ($LASTEXITCODE -ne 0) { throw 'Godot import failed' }
          if (Select-String .godot/import.log -Pattern 'SCRIPT ERROR|Parse Error|Failed loading resource') { throw 'Project load failed' }
      - name: Whitespace validation
        shell: pwsh
        run: |
          git diff --check
          if ($LASTEXITCODE -ne 0) { throw 'Whitespace validation failed' }
      - name: Prototype smoke (headless, no network or browser)
        shell: pwsh
        run: |
          & ./tests/run-smoke.ps1
      - name: Python staging tests
        if: github.event_name == 'workflow_dispatch' && inputs.extended
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path .godot/verification -Force | Out-Null
          python -m unittest discover -s tests -p test_asset_staging.py *> .godot/verification/python-staging.log
          $testExit = $LASTEXITCODE
          Get-Content .godot/verification/python-staging.log
          if ($testExit -ne 0) { throw 'Staging tests failed' }
      - name: UI cache fixture tests
        if: github.event_name == 'workflow_dispatch' && inputs.extended
        shell: pwsh
        run: |
          python -m pip install -r tools/dev_assets/requirements-ui.txt
          if ($LASTEXITCODE -ne 0) { throw 'UI tool dependency installation failed' }
          python -m unittest discover -s tests -p test_ui_cache.py *> .godot/verification/python-ui-cache.log
          $testExit = $LASTEXITCODE
          Get-Content .godot/verification/python-ui-cache.log
          if ($testExit -ne 0) { throw 'UI cache fixtures failed' }
      - name: Godot visual fallback tests
        if: github.event_name == 'workflow_dispatch' && inputs.extended
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $engine = '.godot/Godot_v4.7.2-stable_win64_console.exe'
          & ./tests/run-visuals.ps1
          & $engine --headless --path . --mode=client res://tests/legacy_batch_visual.tscn -- --no-dev-visuals *> .godot/verification/batch-ci.log
          if ($LASTEXITCODE -ne 0 -or -not (Select-String .godot/verification/batch-ci.log -Pattern 'LEGACY_BATCH_VISUAL_OK 23')) { throw 'Batch placeholders failed' }
      - name: Gameplay regression suites
        if: github.event_name == 'workflow_dispatch' && inputs.extended
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($suite in @('items','spike3d','pve','combat','progression','xp','yang','web-inventory')) {
            & "./tests/run-$suite.ps1"
          }
      - name: Keep verification logs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: verification-logs
          path: |
            .godot/*.log
            .godot/verification/*.log
          include-hidden-files: true
          if-no-files-found: ignore
